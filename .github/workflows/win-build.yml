name: Rofi Windows Build (CMake)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
          msystem: MINGW64

      - name: Build rofi with CMake
        shell: msys2 {0}
        run: |
          mkdir -p build
          cd build
          cmake $GITHUB_WORKSPACE -G"MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/mingw64
          mingw32-make VERBOSE=1
          mingw32-make install

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rofi-windows-artifacts
          path: |
            build/**
            /mingw64/bin/rofi.exe
